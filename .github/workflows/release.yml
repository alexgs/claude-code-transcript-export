name: Release

# A push to main whose package.json version has no tag yet publishes that
# version and then tags it. release-guard.yml makes every PR to main carry such
# a version, so in practice every merge to main is a release.
#
# Publish and tag live in one job on purpose. A tag pushed with GITHUB_TOKEN
# does not trigger other workflows, so a separate tag-triggered publish would
# silently never run.
#
# Keep this filename: npm trusted publishing is configured against
# release.yml, and there is no token to fall back on.

on:
  push:
    branches: [main]
  # Retries a release whose publish or tag step failed.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # Push the tag.
      contents: write
      # Required for npm provenance via OIDC.
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          # Tags are needed to tell whether this version is already released.
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Decide whether this commit is a release
        id: plan
        run: |
          set -euo pipefail
          name="$(node -p 'require("./package.json").name')"
          version="$(node -p 'require("./package.json").version')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version is already tagged; nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"

          # The tag is the record of a release, but it is pushed after the
          # publish. If a run publishes and then fails to tag, the rerun must
          # not try to publish the same version again, which npm refuses.
          # `npm view` exits non-zero on a version that does not exist.
          if [ -n "$(npm view "$name@$version" version 2>/dev/null || true)" ]; then
            echo "$name@$version is already on npm; will only tag."
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.plan.outputs.release == 'true'
        run: npm ci
      # The full suite runs again here: a merge must not publish something CI
      # never checked on this exact commit.
      - if: steps.plan.outputs.release == 'true'
        run: npm run format:check
      - if: steps.plan.outputs.release == 'true'
        run: npm run typecheck
      - if: steps.plan.outputs.release == 'true'
        run: npm test
      - if: steps.plan.outputs.release == 'true'
        run: npm run build
      - if: steps.plan.outputs.release == 'true' && steps.plan.outputs.published == 'false'
        run: npm publish --provenance --access public
      - name: Tag the release
        if: steps.plan.outputs.release == 'true'
        env:
          TAG: v${{ steps.plan.outputs.version }}
        run: |
          # Lightweight, like the tags cut by hand before this workflow.
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "$TAG"
